    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NQ2CZMJXCS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // SupabaseのセッションからUser IDを取得してGA4に紐付け（SHA-256で匿名化）
      async function setHashedUserId() {
        const sbAuthToken = localStorage.getItem('sb-ubnqbpsbtmdplmlivxbj-auth-token');
        let userId = null;
        if (sbAuthToken) {
          try { userId = JSON.parse(sbAuthToken).user?.id; } catch (e) {}
        }

        if (userId) {
          const msgUint8 = new TextEncoder().encode(userId);
          const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          const hashedId = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
          gtag('config', 'G-NQ2CZMJXCS', { 'user_id': hashedId });
        } else {
          gtag('config', 'G-NQ2CZMJXCS');
        }
      }
      setHashedUserId();
    </script>

        #final { position:fixed; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; opacity:0; pointer-events:none; z-index:1800; transition:opacity 6s ease-in; }
        #final a { padding:15px 25px; border:1px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.7); text-decoration:none; margin:10px; font-size:0.9rem; }
        
        #tap-area { position:absolute; width:100%; height:100%; z-index:350; cursor:pointer; }

<script>
const moonLevels = [0.6, 0.3, 0.1, 0]; 
let timeLeft = 120; 
let remaining = 14; 
let flies = [], context, source, gainNode, timerInterval;
const sessionStartTime = Date.now();
let audioStarted = false, isEnding = false, isFinal = false, moonStep = 0; 

const stage = document.getElementById('stage'), moon = document.getElementById('moon');
const centerLight = document.getElementById('center-light'), finalU = document.getElementById('final'), curtain = document.getElementById('curtain');
const timerBtn = document.getElementById('timer-btn'), timerMenu = document.getElementById('timer-menu'), timerDisplay = document.getElementById('timer-display');
const container = document.getElementById('hotaru-container');
const crisisOverlay = document.getElementById('crisis-overlay');

function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

function updateTimer() {
    if (isEnding) return;
    if (timeLeft > 0) {
        timeLeft--;
        timerDisplay.textContent = formatTime(timeLeft);
        
        if (timeLeft === 15 && audioStarted && gainNode) {
            gainNode.gain.cancelScheduledValues(context.currentTime);
            gainNode.gain.setValueAtTime(gainNode.gain.value, context.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 15);
        }
    }

    if (timeLeft <= 0) {
        clearInterval(timerInterval);
        endScene();
    }
}

function updateMoon() {
    if (moonStep < moonLevels.length) { 
        moon.style.opacity = moonLevels[moonStep++]; 
    }
}

async function startAudio() {
    if (audioStarted) return;
    audioStarted = true;
    try {
        context = new (window.AudioContext || window.webkitAudioContext)();
        const resp = await fetch('bgm_summer.m4a');
        const buffer = await context.decodeAudioData(await resp.arrayBuffer());
        source = context.createBufferSource();
        source.buffer = buffer; source.loop = true;
        gainNode = context.createGain();
        gainNode.gain.setValueAtTime(0, context.currentTime);
        gainNode.gain.linearRampToValueAtTime(1.0, context.currentTime + 2);
        source.connect(gainNode); gainNode.connect(context.destination);
        source.start();
    } catch(e) { console.error("Audio Load Error", e); audioStarted = false; }
}

function updateVolumeByCount() {
    if (!gainNode || !context) return;
    const nextCount = remaining - 1;
    const nextVolume = Math.max(0, nextCount / 14);
    
    gainNode.gain.cancelScheduledValues(context.currentTime);
    gainNode.gain.setValueAtTime(gainNode.gain.value, context.currentTime);
    gainNode.gain.linearRampToValueAtTime(nextVolume, context.currentTime + 1.5);
}

function killOne() {
    const alive = flies.filter(f => !f.dead && !f.dying);
    if (alive.length === 0) return;

    updateVolumeByCount();

    const nextBrightness = 0.2 + ((remaining - 1) / 14) * 0.8;
    stage.style.filter = `brightness(${nextBrightness})`;
    
    const target = alive[Math.floor(Math.random() * alive.length)];
    target.dying = true;
    const el = target.el;

    el.style.transition = 'none'; 
    el.style.background = '#fff'; 
    el.style.boxShadow = '0 0 40px 20px #fffde0'; 
    el.style.transform += ' scale(4.0)'; 
    el.style.opacity = '1';
    
    if ([12, 9, 4, 1].includes(remaining)) updateMoon();
    
    if (remaining === 11) document.querySelectorAll('#house2 .house-light').forEach(l => l.style.opacity = '0');
    else if (remaining === 9) document.querySelectorAll('#house3 .house-light').forEach(l => l.style.opacity = '0');
    else if (remaining === 7) document.querySelectorAll('#house1 .house-light').forEach(l => l.style.opacity = '0');
    
    setTimeout(() => {
        el.style.transition = 'opacity 2.5s ease-out, transform 2.5s ease-out';
        el.style.opacity = '0'; 
        el.style.transform = 'scale(0.1)';
        setTimeout(() => { 
            target.dead = true; 
            remaining--; 
            if (remaining <= 0) endScene(); 
        }, 2500);
    }, 100);
}

function endScene() {
    if (isEnding) return; 
    isEnding = true;
    clearInterval(timerInterval);
    
    if (gainNode) {
        gainNode.gain.cancelScheduledValues(context.currentTime);
        gainNode.gain.linearRampToValueAtTime(0, context.currentTime + 2.5);
    }

    stage.style.opacity = '0'; 
    moon.style.opacity = '0';
    document.getElementById('ui-layer').style.opacity = '0'; 
    document.getElementById('bottom-layer').style.opacity = '0'; 
    flies.forEach(f => { f.el.style.transition = 'opacity 5s'; f.el.style.opacity = '0'; });
    
    setTimeout(() => {
        curtain.style.opacity = '1';
        setTimeout(() => { 
            isFinal = true;
            centerLight.style.transition = 'opacity 3s ease';
            centerLight.style.opacity = '0';
            finalU.style.opacity = '1'; 
            finalU.style.pointerEvents = 'auto'; 
        }, 6000); 
    }, 4000);
}

function initHotaru() {
    for (let i = 0; i < 14; i++) {
        const el = document.createElement('div'); 
        el.className = 'hotaru';
        el.style.left = (Math.random() * 80 + 10) + '%'; 
        el.style.top = (Math.random() * 70 + 10) + '%';
        container.appendChild(el);
        
        const fly = { el, a: Math.random() * Math.PI * 2, dying: false, dead: false };
        flies.push(fly);
        
        const move = () => {
            if (fly.dead) return;
            fly.a += 0.015;
            const tx = Math.sin(fly.a) * 15;
            const ty = Math.cos(fly.a * 0.7) * 15;
            fly.el.style.transform = `translate(${tx}px, ${ty}px)`;
            
            if (!fly.dying && !isEnding) {
                fly.el.style.opacity = 0.2 + Math.abs(Math.sin(fly.a * 0.5)) * 0.5;
            }
            requestAnimationFrame(move);
        };
        move();
    }
}

// 減速テンポの計算 (Phase 1 -> Phase 2 -> Phase 3)
function getDynamicTiming() {
    const elapsed = (Date.now() - sessionStartTime) / 1000;
    if (elapsed < 30) {
        return { inhale: 1500, exhale: 2500, next: 4000 };
    } else if (elapsed < 90) {
        const progress = (elapsed - 30) / 60;
        const inhale = 1500 + (1500 * progress);
        const exhale = 2500 + (3500 * progress);
        return { inhale, exhale, next: inhale + exhale };
    } else {
        return { inhale: 3000, exhale: 6000, next: 10000 };
    }
}

function breathe() {
    if (isFinal) return;
    const timing = getDynamicTiming();
    const elapsed = (Date.now() - sessionStartTime) / 1000;
    const jitter = (elapsed > 90) ? (Math.random() - 0.5) * 1500 : 0;

    centerLight.style.transition = `all ${timing.inhale}ms ease-out`;
    centerLight.style.opacity = "1.0";
    centerLight.style.background = "#fffbe0";
    centerLight.style.boxShadow = "0 0 50px 20px rgba(255, 215, 0, 0.6)";
    centerLight.style.transform = "translate(-50%, -50%) scale(1.3)";

    setTimeout(() => {
        if (isFinal) return;
        centerLight.style.transition = `all ${timing.exhale}ms ease-in-out`;
        centerLight.style.opacity = "0.05";
        centerLight.style.background = "#fffde0";
        centerLight.style.boxShadow = "0 0 10px 5px rgba(255, 215, 0, 0.2)";
        centerLight.style.transform = "translate(-50%, -50%) scale(0.7)";

        const waitTime = Math.max(100, (timing.next - timing.inhale - timing.exhale) + 1000 + jitter);
        setTimeout(breathe, waitTime);
    }, timing.inhale + 500);
}

initHotaru();
breathe();
timerInterval = setInterval(updateTimer, 1000);

window.addEventListener('load', () => {
    // Breath Overlay Logic
    const breathOverlay = document.getElementById('breath-overlay');
    if (breathOverlay) {
        setTimeout(() => { 
            breathOverlay.style.transition = "opacity 0.5s ease";
            breathOverlay.style.opacity = 1; 
        }, 100);
        
        const dismissBreath = () => {
            if (!breathOverlay.parentElement) return; 
            breathOverlay.style.transition = "opacity 1s ease";
            breathOverlay.style.opacity = 0;
            setTimeout(() => { breathOverlay.remove(); }, 1000);
            window.removeEventListener('touchstart', dismissBreath);
            window.removeEventListener('mousedown', dismissBreath);
        };
        
        // 0.5s (fade-in) + 3s (keep) = 3.5s
        setTimeout(dismissBreath, 3600);
        window.addEventListener('touchstart', dismissBreath);
        window.addEventListener('mousedown', dismissBreath);
    }
});

document.getElementById('help-btn').addEventListener('pointerdown', (e) => { 
    e.stopPropagation(); 
    crisisOverlay.style.display = 'flex'; 
});

document.getElementById('close-crisis').addEventListener('pointerdown', (e) => { 
    e.stopPropagation(); 
    crisisOverlay.style.display = 'none'; 
});

timerBtn.addEventListener('pointerdown', (e) => { 
    e.stopPropagation(); 
    timerMenu.style.display = (timerMenu.style.display === 'flex') ? 'none' : 'flex'; 
});

document.querySelectorAll('.menu-item').forEach(item => {
    item.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        timeLeft = parseInt(item.getAttribute('data-sec'));
        timerDisplay.textContent = formatTime(timeLeft);
        timerMenu.style.display = 'none';
        startAudio();
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(updateTimer, 1000);
    });
});

window.addEventListener('pointerdown', () => { 
    timerMenu.style.display = 'none'; 
});

document.getElementById('tap-area').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    startAudio(); 
    if (!isEnding) killOne();
});

function navigateWithFade(targetUrl) {
    if (isEnding && !isFinal) return; // すでに終了シーケンス中の場合は無視（ただし最後の選択肢は有効）
    
    curtain.style.pointerEvents = 'auto'; 
    curtain.style.opacity = '1'; 
    if (gainNode && context) {
        try {
            gainNode.gain.cancelScheduledValues(context.currentTime);
            gainNode.gain.setValueAtTime(gainNode.gain.value, context.currentTime);
            gainNode.gain.linearRampToValueAtTime(0, context.currentTime + 3);
        } catch(e) { console.error(e); }
    }
    setTimeout(() => { window.location.href = targetUrl; }, 3500); 
}

document.getElementById('exit-link').addEventListener('click', (e) => {
    e.preventDefault(); 
    navigateWithFade("talk_trial.html");
});

document.getElementById('top-close-btn').addEventListener('click', (e) => {
    e.preventDefault();
    navigateWithFade("index_trial_bk_2.html");
});

document.querySelectorAll('.final-nav-link').forEach(link => {
    link.addEventListener('click', (e) => {
        e.preventDefault();
        navigateWithFade(link.getAttribute('href'));
    });
});
</script>
